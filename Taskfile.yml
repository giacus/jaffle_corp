version: "3"

vars:
  PROJECTS: "projects/jaffle_platform projects/jaffle_supply projects/jaffle_finance projects/jaffle_experience projects/jaffle_growth projects/jaffle_store_ops projects/jaffle_merchandising projects/jaffle_planning projects/jaffle_legacy"
  SEED_PROJECTS: "projects/jaffle_platform projects/jaffle_supply projects/jaffle_experience projects/jaffle_store_ops projects/jaffle_merchandising projects/jaffle_planning"

tasks:
  deps:
    cmds:
      - for: { var: PROJECTS }
        cmd: dbt deps --project-dir {{ .ITEM }} --profiles-dir .

  seed:
    cmds:
      - for: { var: SEED_PROJECTS }
        cmd: dbt seed --project-dir {{ .ITEM }} --profiles-dir .

  parse:
    deps: [deps]
    cmds:
      - for: { var: PROJECTS }
        cmd: dbt parse --project-dir {{ .ITEM }} --profiles-dir .

  lint:
    deps: [deps]
    cmds:
      - scripts/lint_sql_projects.sh

  build:
    deps: [deps, seed]
    cmds:
      - for: { var: PROJECTS }
        cmd: dbt build --project-dir {{ .ITEM }} --profiles-dir .

  semantic:
    deps: [build]
    cmds:
      - |
        export JAFFLE_CORP_DUCKDB_PATH="$PWD/jaffle_corp.duckdb"
        (
          cd projects/jaffle_finance
          DBT_PROFILES_DIR=../.. mf validate-configs --skip-dw
          DBT_PROFILES_DIR=../.. mf query --metrics net_revenue_usd,estimated_gross_margin_usd,refund_rate --group-by metric_time,location,order__country_code --limit 20
        )
        (
          cd projects/jaffle_growth
          DBT_PROFILES_DIR=../.. mf validate-configs --skip-dw
          DBT_PROFILES_DIR=../.. mf query --metrics attributed_net_revenue_usd,campaign_roas --group-by metric_time,campaign_performance__campaign_id,campaign_performance__channel --limit 20
        )
        (
          cd projects/jaffle_merchandising
          DBT_PROFILES_DIR=../.. mf validate-configs --skip-dw
          DBT_PROFILES_DIR=../.. mf query --metrics merchandising_observed_hours,merchandising_available_hours,merchandising_availability_rate,merchandising_outage_minutes --group-by metric_time,product,location,product_store_hour__availability_status,product_store_hour__product_family --limit 20
          DBT_PROFILES_DIR=../.. mf query --metrics menu_actual_units,menu_target_units,menu_unit_attainment_rate,cumulative_menu_actual_units_4w --group-by metric_time,location,menu_goal__product_family,menu_goal__unit_goal_status --limit 20
        )
        (
          cd projects/jaffle_planning
          DBT_PROFILES_DIR=../.. mf validate-configs --skip-dw
          DBT_PROFILES_DIR=../.. mf query --metrics planned_component_usage,actual_component_usage --group-by metric_time,location,component,component_week_plan__scenario_name,component_week_plan__usage_variance_status --limit 20
          DBT_PROFILES_DIR=../.. mf query --metrics forecasted_orders,actual_orders_for_forecast,absolute_order_forecast_error,forecast_interval_hit_rate --group-by metric_time,location,store_hour_forecast__scenario_name,store_hour_forecast__forecast_accuracy_band --limit 20
        )

  validate:
    cmds:
      - scripts/validate_repo.sh

  build-platform:
    deps: [deps, seed]
    cmds:
      - dbt build --project-dir projects/jaffle_platform --profiles-dir .

  build-public-stack:
    deps: [deps, seed]
    cmds:
      - dbt build --project-dir projects/jaffle_platform --profiles-dir .
      - dbt build --project-dir projects/jaffle_supply --profiles-dir .
      - dbt build --project-dir projects/jaffle_finance --profiles-dir .
      - dbt build --project-dir projects/jaffle_experience --profiles-dir .
      - dbt build --project-dir projects/jaffle_growth --profiles-dir .
      - dbt build --project-dir projects/jaffle_store_ops --profiles-dir .
      - dbt build --project-dir projects/jaffle_merchandising --profiles-dir .
      - dbt build --project-dir projects/jaffle_planning --profiles-dir .

  clean:
    cmds:
      - for: { var: PROJECTS }
        cmd: dbt clean --project-dir {{ .ITEM }} --profiles-dir .
