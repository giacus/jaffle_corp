version: "3"

# Task is only a discoverable front door. The scripts remain the canonical
# implementation so local use, CI, and contributor docs cannot drift apart.
tasks:
  default:
    desc: List the available repository tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the local toolchain and run the fast smoke compile
    cmds:
      - scripts/bootstrap.sh

  setup-full:
    desc: Install the toolchain and compile every project
    cmds:
      - scripts/bootstrap.sh --full

  validate:
    desc: Reset generated state and validate the complete repository
    cmds:
      - scripts/validate_repo.sh

  manifest:
    desc: Generate the full-project dbt manifest
    cmds:
      - scripts/generate_manifest.sh

  docs:
    desc: Generate the full-project dbt documentation site
    cmds:
      - scripts/docs.sh generate

  docs-serve:
    desc: Serve generated dbt documentation at localhost:8080
    cmds:
      - scripts/docs.sh serve

  clean-state:
    desc: Remove generated data and artifacts while preserving .venv
    cmds:
      - scripts/clean.sh --keep-venv

  clean:
    desc: Remove all generated local state, including .venv
    cmds:
      - scripts/clean.sh

  lint:
    desc: Lint SQL in every dbt project
    cmds:
      - scripts/lint_sql_projects.sh
