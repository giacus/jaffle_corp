version: "3"

# Task is only a discoverable front door. The scripts remain the canonical
# implementation so local use, CI, and contributor docs cannot drift apart.
tasks:
  default:
    desc: List the available repository tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the local toolchain and run the fast smoke compile
    cmds:
      - scripts/bootstrap.sh

  setup-full:
    desc: Install the toolchain and compile every project
    cmds:
      - scripts/bootstrap.sh --full

  validate:
    desc: Run the complete repository validator
    cmds:
      - scripts/validate_repo.sh

  manifest:
    desc: Generate the full-project dbt manifest
    cmds:
      - scripts/generate_manifest.sh

  lint:
    desc: Lint SQL in every dbt project
    cmds:
      - scripts/lint_sql_projects.sh
