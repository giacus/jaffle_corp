name: reliability
version: "0.1.0"
config-version: 2

profile: jaffle_corp
require-dbt-version: "=1.11.12"
restrict-access: true

model-paths: ["models"]
function-paths: ["functions"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - dbt_packages

on-run-start:
  - "{{ reliability_input_readiness() }}"

models:
  reliability:
    +materialized: view
    +post-hook: "{{ shared.audit_noop() }}"
    +meta:
      domain: reliability
      source_system: downstream_extension_fixture
    marts:
      +schema: mart_reliability
      +materialized: table
      +pre-hook: "select count(*) as finance_day_count from {{ ref('finance', 'fct_daily_store_pnl') }}"
      +tags: ["mart", "reliability", "extension"]
