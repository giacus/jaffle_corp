name: mart_campaign_day_growth
description: Executable MetricFlow query spec for a campaign-day growth mart.
semantic_model: campaign_performance
time_dimension: campaign_date
grain: day
dimensions:
  - campaign_performance__campaign_id
  - campaign_performance__channel
metrics:
  - attributed_net_revenue_usd
  - campaign_roas
materialization:
  type: incremental
  owner: growth@jaffle.example
