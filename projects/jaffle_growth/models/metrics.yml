version: 2

metrics:
  - name: activated_customers
    description: Customers with at least one completed order.
    type: simple
    label: Activated Customers
    type_params:
      measure: activated_customer_count

  - name: growth_customer_count
    description: Count of customers in the growth lifecycle mart.
    type: simple
    label: Growth Customer Count
    type_params:
      measure: growth_customer_count

  - name: repeat_customers
    description: Customers with at least two completed orders.
    type: simple
    label: Repeat Customers
    type_params:
      measure: repeat_customer_count

  - name: activation_rate
    description: Share of customers who completed an order.
    type: ratio
    label: Activation Rate
    type_params:
      numerator: activated_customers
      denominator: growth_customer_count

  - name: attributed_net_revenue_usd
    description: Net revenue attributed to campaigns.
    type: simple
    label: Attributed Net Revenue USD
    type_params:
      measure: attributed_net_revenue_usd

  - name: estimated_campaign_cost_usd
    description: Estimated campaign cost in USD.
    type: simple
    label: Estimated Campaign Cost USD
    type_params:
      measure: estimated_campaign_cost_usd

  - name: campaign_roas
    description: Attributed net revenue divided by estimated campaign cost.
    type: ratio
    label: Campaign ROAS
    type_params:
      numerator: attributed_net_revenue_usd
      denominator: estimated_campaign_cost_usd

  - name: growth_experiment_exposures
    description: Count of experiment exposures in growth rollups.
    type: simple
    label: Growth Experiment Exposures
    type_params:
      measure: growth_experiment_exposure_count

  - name: growth_experiment_conversions
    description: Count of converted experiment exposures in growth rollups.
    type: simple
    label: Growth Experiment Conversions
    type_params:
      measure: growth_experiment_conversion_count

  - name: growth_experiment_conversion_rate
    description: Share of growth experiment exposures that converted.
    type: ratio
    label: Growth Experiment Conversion Rate
    type_params:
      numerator: growth_experiment_conversions
      denominator: growth_experiment_exposures
