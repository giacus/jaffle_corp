version: 2

sources:
  - name: jaffle_supply_app
    schema: "{{ target.schema }}_raw"
    description: Synthetic supply-side source tables for recipe and stock examples.
    tables:
      - name: raw_recipe_components
        description: Product-to-component recipe requirements.
      - name: raw_purchase_orders
        description: Component purchase orders and receipts.
      - name: raw_inventory_counts
        description: Store component counts captured by local teams.
      - name: raw_waste_events
        description: Component waste events connected to orders where available.
