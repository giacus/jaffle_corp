version: 2

models:
  - name: stg_purchase_orders
    config:
      group: supply
    columns:
      - name: purchase_order_id
        description: "{{ doc('shared__stg_purchase_orders__purchase_order_id') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: store_id
        description: "{{ doc('shared__stg_purchase_orders__store_id') }}"
        data_type: varchar
      - name: component_id
        description: "{{ doc('shared__stg_purchase_orders__component_id') }}"
        data_type: varchar
      - name: supplier_name
        description: "{{ doc('shared__stg_purchase_orders__supplier_name') }}"
        data_type: varchar
      - name: ordered_at_utc
        description: "{{ doc('shared__stg_purchase_orders__ordered_at_utc') }}"
        data_type: timestamp
      - name: expected_at_utc
        description: "{{ doc('shared__stg_purchase_orders__expected_at_utc') }}"
        data_type: timestamp
      - name: received_at_utc
        description: "{{ doc('shared__stg_purchase_orders__received_at_utc') }}"
        data_type: timestamp
      - name: purchase_order_status
        description: "{{ doc('shared__stg_purchase_orders__purchase_order_status') }}"
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - received
                  - partially_received
                  - open
                  - cancelled
                  - unknown
      - name: raw_purchase_order_status
        description: "{{ doc('shared__stg_purchase_orders__raw_purchase_order_status') }}"
        data_type: varchar
      - name: quantity_ordered
        description: "{{ doc('shared__stg_purchase_orders__quantity_ordered') }}"
        data_type: double
      - name: quantity_received
        description: "{{ doc('shared__stg_purchase_orders__quantity_received') }}"
        data_type: double
      - name: unit
        description: "{{ doc('shared__stg_purchase_orders__unit') }}"
        data_type: varchar
      - name: unit_cost_minor
        description: "{{ doc('shared__stg_purchase_orders__unit_cost_minor') }}"
        data_type: integer
      - name: unit_cost_major
        description: "{{ doc('shared__stg_purchase_orders__unit_cost_major') }}"
        data_type: double
      - name: currency
        description: "{{ doc('shared__stg_purchase_orders__currency') }}"
        data_type: varchar
      - name: updated_at_utc
        description: "{{ doc('shared__stg_purchase_orders__updated_at_utc') }}"
        data_type: timestamp
    description: "{{ doc('jaffle_supply__stg_purchase_orders') }}"
