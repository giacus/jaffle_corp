version: 2

models:
  - name: stg_menu_goals
    config:
      group: merchandising
    columns:
      - name: goal_id
        description: "{{ doc('shared__stg_menu_goals__goal_id') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: store_id
        description: "{{ doc('shared__stg_stores__store_id') }}"
        data_type: varchar
      - name: product_family
        description: "{{ doc('shared__stg_products__product_family') }}"
        data_type: varchar
      - name: goal_week_start_utc
        description: "{{ doc('shared__stg_menu_goals__goal_week_start_utc') }}"
        data_type: date
      - name: target_units
        description: "{{ doc('shared__stg_menu_goals__target_units') }}"
        data_type: integer
      - name: target_net_revenue_usd
        description: "{{ doc('shared__stg_menu_goals__target_net_revenue_usd') }}"
        data_type: double
      - name: target_margin_usd
        description: "{{ doc('shared__stg_menu_goals__target_margin_usd') }}"
        data_type: double
      - name: owner_role
        description: "{{ doc('shared__stg_menu_goals__owner_role') }}"
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - menu_lead
                  - store_lead
                  - analyst
    description: "{{ doc('merchandising__stg_menu_goals') }}"
