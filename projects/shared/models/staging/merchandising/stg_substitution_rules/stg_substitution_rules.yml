version: 2

models:
  - name: stg_substitution_rules
    config:
      group: merchandising
    columns:
      - name: substitution_rule_id
        description: "{{ doc('shared__stg_substitution_rules__substitution_rule_id') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: store_id
        description: "{{ doc('shared__stg_substitution_rules__store_id') }}"
        data_type: varchar
      - name: unavailable_product_id
        description: "{{ doc('shared__stg_substitution_rules__unavailable_product_id') }}"
        data_type: varchar
      - name: substitute_product_id
        description: "{{ doc('shared__stg_substitution_rules__substitute_product_id') }}"
        data_type: varchar
      - name: priority_rank
        description: "{{ doc('shared__stg_substitution_rules__priority_rank') }}"
        data_type: integer
      - name: effective_from_utc
        description: "{{ doc('shared__stg_substitution_rules__effective_from_utc') }}"
        data_type: timestamp
      - name: effective_to_utc
        description: "{{ doc('shared__stg_substitution_rules__effective_to_utc') }}"
