version: 2

models:
  - name: stg_store_hour_forecasts
    config:
      group: planning
    columns:
      - name: forecast_id
        description: "{{ doc('shared__stg_store_hour_forecasts__forecast_id') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: model_run_id
        description: "{{ doc('shared__stg_store_hour_forecasts__model_run_id') }}"
        data_type: varchar
      - name: store_id
        description: "{{ doc('shared__stg_store_hour_forecasts__store_id') }}"
        data_type: varchar
      - name: forecast_hour_utc
        description: "{{ doc('shared__stg_store_hour_forecasts__forecast_hour_utc') }}"
        data_type: timestamp
      - name: forecasted_order_count
        description: "{{ doc('shared__stg_store_hour_forecasts__forecasted_order_count') }}"
        data_type: double
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: '>= 0'
      - name: lower_bound_orders
        description: "{{ doc('shared__stg_store_hour_forecasts__lower_bound_orders') }}"
        data_type: double
      - name: upper_bound_orders
        description: "{{ doc('shared__stg_store_hour_forecasts__upper_bound_orders') }}"
        data_type: double
      - name: scenario_name
        description: "{{ doc('shared__stg_store_hour_forecasts__scenario_name') }}"
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - base
                  - stretch
      - name: model_version
        description: "{{ doc('shared__stg_store_hour_forecasts__model_version') }}"
        data_type: varchar
      - name: created_at_utc
        description: "{{ doc('shared__stg_store_hour_forecasts__created_at_utc') }}"
        data_type: timestamp
      - name: updated_at_utc
        description: "{{ doc('shared__stg_store_hour_forecasts__updated_at_utc') }}"
        data_type: timestamp
    description: "{{ doc('jaffle_planning__stg_store_hour_forecasts') }}"
