version: 2

models:
  - name: stg_orders
    config:
      group: platform
    constraints:
      - type: foreign_key
        columns: [customer_id]
        to: source('platform_app', 'raw_customers')
        to_columns: [customer_id]
    columns:
      - name: order_id
        description: "{{ doc('shared__stg_orders__order_id') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: "{{ doc('shared__stg_customers__customer_id') }}"
        data_type: varchar
        data_tests:
          - relationships:
              arguments:
                to: source('platform_app', 'raw_customers')
                field: customer_id
      - name: store_id
        description: "{{ doc('shared__stg_stores__store_id') }}"
        data_type: varchar
      - name: ordered_at_utc
        description: "{{ doc('shared__stg_orders__ordered_at_utc') }}"
        data_type: timestamp
      - name: ordered_date_utc
        description: "{{ doc('shared__stg_orders__ordered_date_utc') }}"
        data_type: date
      - name: order_status
        description: "{{ doc('shared__stg_orders__order_status') }}"
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - placed
                  - completed
                  - cancelled
                  - refunded
                  - unknown
      - name: raw_order_status
        description: "{{ doc('shared__stg_orders__raw_order_status') }}"
        data_type: varchar
      - name: channel
        description: "{{ doc('shared__stg_orders__channel') }}"
        data_type: varchar
      - name: currency
        description: "{{ doc('shared__stg_fx_rates__currency') }}"
        data_type: varchar
      - name: subtotal_minor
        description: "{{ doc('shared__stg_orders__subtotal_minor') }}"
        data_type: integer
      - name: tax_minor
        description: "{{ doc('shared__stg_orders__tax_minor') }}"
        data_type: integer
      - name: discount_minor
        description: "{{ doc('shared__stg_orders__discount_minor') }}"
        data_type: integer
      - name: service_fee_minor
        description: "{{ doc('shared__stg_orders__service_fee_minor') }}"
        data_type: integer
      - name: loyalty_points_redeemed
        description: "{{ doc('shared__stg_orders__loyalty_points_redeemed') }}"
        data_type: integer
      - name: order_total_minor
        description: "{{ doc('shared__stg_orders__order_total_minor') }}"
        data_type: integer
      - name: order_total_major
        description: "{{ doc('shared__stg_orders__order_total_major') }}"
        data_type: double
      - name: legacy_order_number
        description: "{{ doc('shared__stg_orders__legacy_order_number') }}"
        data_type: varchar
      - name: updated_at_utc
        description: "{{ doc('shared__stg_orders__updated_at_utc') }}"
        data_type: timestamp
    description: "{{ doc('platform__stg_orders') }}"
