version: 2

models:
  - name: stg_payments
    config:
      group: platform
    columns:
      - name: payment_id
        description: "{{ doc('shared__stg_payments__payment_id') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: "{{ doc('shared__stg_payments__order_id') }}"
        data_type: varchar
      - name: payment_status
        description: "{{ doc('shared__stg_payments__payment_status') }}"
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - captured
                  - authorized
                  - failed
                  - refunded
                  - unknown
      - name: raw_payment_status
        description: "{{ doc('shared__stg_payments__raw_payment_status') }}"
        data_type: varchar
      - name: payment_method
        description: "{{ doc('shared__stg_payments__payment_method') }}"
        data_type: varchar
      - name: authorized_at_utc
        description: "{{ doc('shared__stg_payments__authorized_at_utc') }}"
        data_type: timestamp
      - name: captured_at_utc
        description: "{{ doc('shared__stg_payments__captured_at_utc') }}"
        data_type: timestamp
      - name: amount_minor
        description: "{{ doc('shared__stg_payments__amount_minor') }}"
        data_type: integer
      - name: amount_major
        description: "{{ doc('shared__stg_payments__amount_major') }}"
        data_type: double
      - name: currency
        description: "{{ doc('shared__stg_payments__currency') }}"
        data_type: varchar
      - name: processor_region
        description: "{{ doc('shared__stg_payments__processor_region') }}"
        data_type: varchar
      - name: updated_at_utc
        description: "{{ doc('shared__stg_payments__updated_at_utc') }}"
        data_type: timestamp
    description: "{{ doc('jaffle_platform__stg_payments') }}"
