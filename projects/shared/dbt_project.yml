name: jaffle_shared
version: "0.1.0"
config-version: 2

profile: jaffle_corp
require-dbt-version: "=1.11.12"

# Shared is deliberately a local code package. Its protected staging models are
# implementation inputs for domain projects, not dbt Mesh public interfaces.
restrict-access: false

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  jaffle_shared:
    +materialized: view
    +post-hook: "{{ jaffle_shared.audit_noop() }}"
    staging:
      platform:
        +schema: stg
        +tags: ["staging", "platform"]
        +access: protected
        +meta:
          domain: platform
          source_system: synthetic_jaffle_corp
      supply:
        +schema: stg_supply
        +tags: ["staging", "supply"]
        +access: protected
        +meta:
          domain: supply
          source_system: synthetic_jaffle_corp
      experience:
        +schema: stg_experience
        +tags: ["staging", "experience"]
        +access: protected
        +meta:
          domain: experience
          source_system: synthetic_jaffle_corp
      store_ops:
        +schema: stg_store_ops
        +tags: ["staging", "store_ops"]
        +access: protected
        +meta:
          domain: store_ops
          source_system: synthetic_jaffle_corp
      merchandising:
        +schema: stg_merchandising
        +tags: ["staging", "merchandising"]
        +access: protected
        +meta:
          domain: merchandising
          source_system: synthetic_jaffle_corp
      planning:
        +schema: stg_planning
        +tags: ["staging", "planning"]
        +access: protected
        +meta:
          domain: planning
          source_system: synthetic_jaffle_corp
seeds:
  jaffle_shared:
    +schema: raw
    +quote_columns: false
