version: 2

models:
  - name: fct_daily_store_pnl
    description: "{{ doc('finance__fct_daily_store_pnl') }}"
    config:
      group: finance
      access: public
      contract:
        enforced: true
    columns:
      - name: store_pnl_key
        description: "{{ doc('finance__fct_daily_store_pnl__store_pnl_key') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: store_id
        description: "{{ doc('shared__stg_stores__store_id') }}"
        data_type: varchar
      - name: recognized_date
        description: "{{ doc('finance__fct_order_revenue__recognized_date') }}"
        data_type: date
      - name: country_code
        description: "{{ doc('shared__stg_stores__country_code') }}"
        data_type: varchar
      - name: city
        description: "{{ doc('shared__stg_stores__city') }}"
        data_type: varchar
      - name: franchise_owner
        description: "{{ doc('shared__stg_stores__franchise_owner') }}"
        data_type: varchar
      - name: order_count
        description: "{{ doc('finance__fct_daily_store_pnl__order_count') }}"
        data_type: integer
      - name: gross_revenue_usd
        description: "{{ doc('finance__fct_daily_store_pnl__gross_revenue_usd') }}"
        data_type: double
      - name: net_revenue_usd
        description: "{{ doc('finance__fct_daily_store_pnl__net_revenue_usd') }}"
        data_type: double
      - name: refunded_amount_usd
        description: "{{ doc('finance__fct_daily_store_pnl__refunded_amount_usd') }}"
        data_type: double
      - name: estimated_supply_cost_usd
        description: "{{ doc('finance__fct_daily_store_pnl__estimated_supply_cost_usd') }}"
        data_type: double
      - name: estimated_gross_margin_usd
        description: "{{ doc('finance__fct_daily_store_pnl__estimated_gross_margin_usd') }}"
        data_type: double
      - name: order_item_count
        description: "{{ doc('finance__fct_daily_store_pnl__order_item_count') }}"
        data_type: integer
      - name: total_item_quantity
        description: "{{ doc('finance__fct_daily_store_pnl__total_item_quantity') }}"
        data_type: integer
      - name: payment_risk_order_count
        description: "{{ doc('finance__fct_daily_store_pnl__payment_risk_order_count') }}"
        data_type: integer
