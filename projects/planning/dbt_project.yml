name: jaffle_planning
version: "0.1.0"
config-version: 2

profile: jaffle_corp
require-dbt-version: "=1.11.12"
restrict-access: true

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: target
clean-targets:
  - target
  - dbt_packages

vars:
  data_interval_start: "2026-01-01 00:00:00"
  data_interval_end: "2026-01-08 00:00:00"
  window_hours_back: 168
  planning_accuracy_tolerance: 0.25

models:
  jaffle_planning:
    +materialized: view
    +post-hook: "{{ jaffle_shared.audit_noop() }}"
    +meta:
      domain: planning
      source_system: synthetic_jaffle_corp
    intermediate:
      +schema: int_planning
      +materialized: ephemeral
      +tags: ["intermediate", "planning"]
      +access: protected
    marts:
      +schema: mart_planning
      +materialized: table
      +tags: ["mart", "planning"]
