version: 2

models:
  - name: stg_store_hour_forecasts
    config:
      group: planning
    columns:
      - name: forecast_id
        data_tests:
          - not_null
          - unique
      - name: forecasted_order_count
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: '>= 0'
      - name: scenario_name
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - base
                  - stretch
    description: "{{ doc('jaffle_planning__stg_store_hour_forecasts') }}"
