version: 2

models:
  - name: fct_component_cost_variance
    description: "{{ doc('jaffle_finance__fct_component_cost_variance') }}"
    config:
      group: finance
      access: public
      contract:
        enforced: true
    columns:
      - name: component_cost_variance_key
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: order_item_id
        data_type: varchar
      - name: order_id
        data_type: varchar
      - name: product_id
        data_type: varchar
      - name: ordered_date_utc
        data_type: date
      - name: quantity
        data_type: integer
      - name: platform_estimated_supply_cost_major
        data_type: double
      - name: recipe_expected_component_cost_usd
        data_type: double
      - name: component_cost_variance_usd
        data_type: double
      - name: component_count
        data_type: bigint
      - name: component_families
        data_type: varchar
