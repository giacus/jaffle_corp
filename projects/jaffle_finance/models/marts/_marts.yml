version: 2

models:
  - name: fct_order_revenue
    description: Public finance fact at one row per order.
    config:
      group: finance
      access: public
      contract:
        enforced: true
    columns:
      - name: order_revenue_key
        data_type: varchar
        data_tests: [not_null, unique]
      - name: order_id
        data_type: varchar
      - name: customer_id
        data_type: varchar
      - name: store_id
        data_type: varchar
      - name: ordered_at_utc
        data_type: timestamp
      - name: recognized_date
        data_type: date
      - name: order_status
        data_type: varchar
      - name: channel
        data_type: varchar
      - name: currency
        data_type: varchar
      - name: country_code
        data_type: varchar
      - name: city
        data_type: varchar
      - name: tax_jurisdiction
        data_type: varchar
      - name: franchise_owner
        data_type: varchar
      - name: gross_revenue_usd
        data_type: double
      - name: captured_amount_usd
        data_type: double
      - name: refunded_amount_usd
        data_type: double
      - name: net_revenue_usd
        data_type: double
      - name: tax_amount_major
        data_type: double
      - name: discount_amount_major
        data_type: double
      - name: service_fee_major
        data_type: double
      - name: estimated_supply_cost_usd
        data_type: double
      - name: estimated_gross_margin_usd
        data_type: double
      - name: order_item_count
        data_type: integer
      - name: total_item_quantity
        data_type: integer
      - name: payment_attempt_count
        data_type: integer
      - name: refund_event_count
        data_type: integer
      - name: revenue_quality_status
        data_type: varchar

  - name: fct_daily_store_pnl
    description: Public finance fact at one row per store per recognized date.
    config:
      group: finance
      access: public
      contract:
        enforced: true
    columns:
      - name: store_pnl_key
        data_type: varchar
        data_tests: [not_null, unique]
      - name: store_id
        data_type: varchar
      - name: recognized_date
        data_type: date
      - name: country_code
        data_type: varchar
      - name: city
        data_type: varchar
      - name: franchise_owner
        data_type: varchar
      - name: order_count
        data_type: integer
      - name: gross_revenue_usd
        data_type: double
      - name: net_revenue_usd
        data_type: double
      - name: refunded_amount_usd
        data_type: double
      - name: estimated_supply_cost_usd
        data_type: double
      - name: estimated_gross_margin_usd
        data_type: double
      - name: order_item_count
        data_type: integer
      - name: total_item_quantity
        data_type: integer
      - name: payment_risk_order_count
        data_type: integer

  - name: fct_order_margin_waterfall
    description: Public finance fact comparing platform-estimated and recipe-derived margin.
    config:
      group: finance
      access: public
      contract:
        enforced: true
    columns:
      - name: order_margin_waterfall_key
        data_type: varchar
        data_tests: [not_null, unique]
      - name: order_id
        data_type: varchar
      - name: customer_id
        data_type: varchar
      - name: store_id
        data_type: varchar
      - name: recognized_date
        data_type: date
      - name: order_status
        data_type: varchar
      - name: channel
        data_type: varchar
      - name: country_code
        data_type: varchar
      - name: city
        data_type: varchar
      - name: gross_revenue_usd
        data_type: double
      - name: captured_amount_usd
        data_type: double
      - name: refunded_amount_usd
        data_type: double
      - name: net_revenue_usd
        data_type: double
      - name: platform_supply_cost_usd
        data_type: double
      - name: recipe_expected_component_cost_usd
        data_type: double
      - name: recipe_cost_variance_usd
        data_type: double
      - name: recipe_margin_usd
        data_type: double
      - name: platform_margin_usd
        data_type: double
      - name: margin_method_variance_usd
        data_type: double
      - name: component_count
        data_type: integer
      - name: order_item_count
        data_type: integer
      - name: total_item_quantity
        data_type: integer
      - name: payment_attempt_count
        data_type: integer
      - name: refund_event_count
        data_type: integer
      - name: revenue_quality_status
        data_type: varchar

  - name: fct_store_day_revenue_quality
    description: Public finance fact for store-day revenue quality monitoring.
    config:
      group: finance
      access: public
      contract:
        enforced: true
    columns:
      - name: store_day_revenue_quality_key
        data_type: varchar
        data_tests: [not_null, unique]
      - name: store_id
        data_type: varchar
      - name: recognized_date
        data_type: date
      - name: country_code
        data_type: varchar
      - name: city
        data_type: varchar
      - name: order_count
        data_type: integer
      - name: net_revenue_usd
        data_type: double
      - name: recipe_margin_usd
        data_type: double
      - name: recipe_cost_variance_usd
        data_type: double
      - name: refund_order_count
        data_type: integer
      - name: revenue_exception_order_count
        data_type: integer
      - name: negative_margin_order_count
        data_type: integer
      - name: recipe_margin_rate
        data_type: double
      - name: refund_order_rate
        data_type: double
      - name: revenue_exception_rate
        data_type: double
      - name: store_day_revenue_quality_status
        data_type: varchar

  - name: fct_component_cost_variance
    description: Public order-item fact for component-cost variance examples.
    config:
      group: finance
      access: public
      contract:
        enforced: true
    columns:
      - name: component_cost_variance_key
        data_type: varchar
        data_tests: [not_null, unique]
      - name: order_item_id
        data_type: varchar
      - name: order_id
        data_type: varchar
      - name: product_id
        data_type: varchar
      - name: ordered_date_utc
        data_type: date
      - name: quantity
        data_type: integer
      - name: platform_estimated_supply_cost_major
        data_type: double
      - name: recipe_expected_component_cost_usd
        data_type: double
      - name: component_cost_variance_usd
        data_type: double
      - name: component_count
        data_type: bigint
      - name: component_families
        data_type: varchar

  - name: dim_finance_controls
    description: Public control dimension for finance lineage and governance examples.
    config:
      group: finance
      access: public
      contract:
        enforced: true
    columns:
      - name: control_id
        data_type: varchar
        data_tests: [not_null, unique]
      - name: control_name
        data_type: varchar
      - name: control_area
        data_type: varchar
      - name: expected_frequency
        data_type: varchar
      - name: severity
        data_type: varchar
      - name: owner_group
        data_type: varchar
