version: 2

models:
  - name: fct_order_revenue
    description: "{{ doc('jaffle_finance__fct_order_revenue') }}"
    config:
      group: finance
      access: public
      contract:
        enforced: true
    columns:
      - name: order_revenue_key
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_type: varchar
      - name: customer_id
        data_type: varchar
      - name: store_id
        data_type: varchar
      - name: ordered_at_utc
        data_type: timestamp
      - name: recognized_date
        data_type: date
      - name: order_status
        data_type: varchar
      - name: channel
        data_type: varchar
      - name: currency
        data_type: varchar
      - name: country_code
        data_type: varchar
      - name: city
        data_type: varchar
      - name: tax_jurisdiction
        data_type: varchar
      - name: franchise_owner
        data_type: varchar
      - name: gross_revenue_usd
        data_type: double
      - name: captured_amount_usd
        data_type: double
      - name: refunded_amount_usd
        data_type: double
      - name: net_revenue_usd
        data_type: double
      - name: tax_amount_major
        data_type: double
      - name: discount_amount_major
        data_type: double
      - name: service_fee_major
        data_type: double
      - name: estimated_supply_cost_usd
        data_type: double
      - name: estimated_gross_margin_usd
        data_type: double
      - name: order_item_count
        data_type: integer
      - name: total_item_quantity
        data_type: integer
      - name: payment_attempt_count
        data_type: integer
      - name: refund_event_count
        data_type: integer
      - name: revenue_quality_status
        data_type: varchar
