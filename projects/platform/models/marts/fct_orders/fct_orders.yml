      - name: payment_attempt_count
        description: "{{ doc('platform__int_orders_enriched__payment_attempt_count') }}"
        data_type: integer
      - name: refund_event_count
        description: "{{ doc('platform__int_orders_enriched__refund_event_count') }}"
        data_type: integer
      - name: has_failed_payment
        description: "{{ doc('platform__int_orders_enriched__has_failed_payment') }}"
        data_type: boolean
      - name: is_completed_order
        description: "{{ doc('platform__int_orders_enriched__is_completed_order') }}"
        data_type: boolean
      - name: is_cancelled_order
        description: "{{ doc('platform__int_orders_enriched__is_cancelled_order') }}"
