version: 2

models:
  - name: fct_orders
    description: "{{ doc('platform__fct_orders') }}"
    config:
      group: platform
      access: public
      post_hook: |
        select
            case when count(*) = 0 then 0
                else error('Every landed order must be present in the published order fact')
            end as missing_published_order_count
        from {{ source('platform_app', 'raw_orders') }} as raw_orders
        left join {{ this }} as published_orders
            on cast(raw_orders.order_id as varchar) = published_orders.order_id
        where published_orders.order_id is null
      contract:
        enforced: true
    columns:
      - name: order_key
        description: "{{ doc('platform__fct_orders__order_key') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: "{{ doc('shared__stg_orders__order_id') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: "{{ doc('shared__stg_orders__customer_id') }}"
        data_type: varchar
      - name: store_id
        description: "{{ doc('shared__stg_orders__store_id') }}"
        data_type: varchar
      - name: ordered_at_utc
        description: "{{ doc('shared__stg_orders__ordered_at_utc') }}"
        data_type: timestamp
      - name: ordered_date_utc
        description: "{{ doc('shared__stg_orders__ordered_date_utc') }}"
        data_type: date
      - name: order_status
        description: "{{ doc('shared__stg_orders__order_status') }}"
        data_type: varchar
      - name: channel
        description: "{{ doc('shared__stg_orders__channel') }}"
        data_type: varchar
      - name: currency
        description: "{{ doc('shared__stg_orders__currency') }}"
        data_type: varchar
      - name: country_code
        description: "{{ doc('shared__stg_stores__country_code') }}"
        data_type: varchar
      - name: city
        description: "{{ doc('shared__stg_stores__city') }}"
        data_type: varchar
      - name: timezone_name
        description: "{{ doc('shared__stg_stores__timezone_name') }}"
        data_type: varchar
      - name: tax_jurisdiction
        description: "{{ doc('shared__stg_stores__tax_jurisdiction') }}"
        data_type: varchar
      - name: franchise_owner
        description: "{{ doc('shared__stg_stores__franchise_owner') }}"
        data_type: varchar
      - name: is_dark_kitchen
        description: "{{ doc('shared__stg_stores__is_dark_kitchen') }}"
        data_type: boolean
      - name: subtotal_minor
        description: "{{ doc('shared__stg_orders__subtotal_minor') }}"
        data_type: integer
      - name: tax_minor
        description: "{{ doc('shared__stg_orders__tax_minor') }}"
        data_type: integer
      - name: discount_minor
        description: "{{ doc('shared__stg_orders__discount_minor') }}"
        data_type: integer
      - name: service_fee_minor
        description: "{{ doc('shared__stg_orders__service_fee_minor') }}"
        data_type: integer
      - name: loyalty_points_redeemed
        description: "{{ doc('shared__stg_orders__loyalty_points_redeemed') }}"
        data_type: integer
      - name: order_total_minor
        description: "{{ doc('shared__stg_orders__order_total_minor') }}"
        data_type: integer
      - name: order_total_major
        description: "{{ doc('shared__stg_orders__order_total_major') }}"
        data_type: double
      - name: order_total_usd
        description: "{{ doc('platform__int_orders_enriched__order_total_usd') }}"
        data_type: double
      - name: captured_amount_minor
        description: "{{ doc('platform__int_orders_enriched__captured_amount_minor') }}"
        data_type: integer
      - name: captured_amount_major
