version: 2

models:
  - name: dim_customers
    description: "{{ doc('platform__dim_customers') }}"
    config:
      group: platform
      access: public
      contract:
        enforced: true
    columns:
      - name: customer_id
        description: "{{ doc('shared__stg_customers__customer_id') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: customer_name
        description: "{{ doc('shared__stg_customers__customer_name') }}"
        data_type: varchar
      - name: email_domain
        description: "{{ doc('shared__stg_customers__email_domain') }}"
        data_type: varchar
      - name: loyalty_region
        description: "{{ doc('shared__stg_customers__loyalty_region') }}"
        data_type: varchar
      - name: first_seen_at
        description: "{{ doc('shared__stg_customers__first_seen_at') }}"
        data_type: timestamp
      - name: default_currency
        description: "{{ doc('shared__stg_customers__default_currency') }}"
        data_type: varchar
      - name: marketing_consent
        description: "{{ doc('shared__stg_customers__marketing_consent') }}"
        data_type: boolean
      - name: first_ordered_at_utc
        description: "{{ doc('platform__int_customer_order_rollup__first_ordered_at_utc') }}"
        data_type: timestamp
      - name: most_recent_ordered_at_utc
        description: "{{ doc('platform__int_customer_order_rollup__most_recent_ordered_at_utc') }}"
        data_type: timestamp
      - name: lifetime_order_count
        description: "{{ doc('platform__dim_customers__lifetime_order_count') }}"
        data_type: integer
      - name: lifetime_completed_order_count
        description: "{{ doc('platform__dim_customers__lifetime_completed_order_count') }}"
        data_type: integer
      - name: lifetime_order_value_usd
        description: "{{ doc('platform__dim_customers__lifetime_order_value_usd') }}"
        data_type: double
      - name: lifetime_refunded_order_count
        description: "{{ doc('platform__dim_customers__lifetime_refunded_order_count') }}"
        data_type: integer
      - name: lifecycle_stage
        description: "{{ doc('platform__dim_customers__lifecycle_stage') }}"
        data_type: varchar
