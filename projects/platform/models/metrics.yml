version: 2

metrics:
  - name: completed_orders
    description: Completed order count.
    type: simple
    label: Completed Orders
    type_params:
      measure: completed_order_count

  - name: order_count
    description: Count of all orders.
    type: simple
    label: Order Count
    type_params:
      measure: order_count

  - name: refunded_order_count
    description: Count of orders with at least one refund event.
    type: simple
    label: Refunded Order Count
    type_params:
      measure: refunded_order_count

  - name: gross_order_amount_usd
    description: Gross order amount in USD.
    type: simple
    label: Gross Order Amount USD
    type_params:
      measure: gross_order_amount_usd

  - name: item_quantity
    description: Total item quantity.
    type: simple
    label: Item Quantity
    type_params:
      measure: item_quantity

  - name: order_refund_event_rate
    description: Share of orders with refund events.
    type: ratio
    label: Order Refund Event Rate
    type_params:
      numerator: refunded_order_count
      denominator: order_count
