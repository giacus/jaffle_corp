selectors:
  - name: merchandising_public_surface
    description: Marts and MetricFlow resources for the merchandising fixture surface.
    definition:
      union:
        - method: path
          value: models/marts
        - method: path
          value: models/semantic_models.yml
        - method: path
          value: models/metrics.yml

  - name: product_store_grains
    description: Models built at product-store-hour or product-store-day grains.
    definition:
      method: tag
      value: product_store_grain
