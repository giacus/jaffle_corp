version: 2

models:
  - name: fct_price_adjustment_windows
    description: "{{ doc('jaffle_merchandising__fct_price_adjustment_windows') }}"
    config:
      group: merchandising
      access: public
      contract:
        enforced: true
    columns:
      - name: price_adjustment_window_key
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: price_adjustment_id
        data_type: varchar
      - name: store_id
        data_type: varchar
      - name: product_id
        data_type: varchar
      - name: product_name
        data_type: varchar
      - name: product_family
        data_type: varchar
      - name: country_code
        data_type: varchar
      - name: effective_from_utc
        data_type: timestamp
      - name: effective_to_utc
        data_type: timestamp
      - name: adjustment_reason
        data_type: varchar
      - name: adjustment_price_minor
        data_type: integer
      - name: published_price_minor
        data_type: integer
      - name: adjustment_delta_minor
        data_type: integer
      - name: adjustment_delta_rate
        data_type: double
      - name: approved_by_role
        data_type: varchar
      - name: adjustment_price_band
        data_type: varchar
      - name: updated_at_utc
        data_type: timestamp
