version: 2

models:
  - name: dim_product_pairings
    description: "{{ doc('merchandising__dim_product_pairings') }}"
    config:
      group: merchandising
      access: public
      contract:
        enforced: true
    columns:
      - name: pairing_id
        description: "{{ doc('shared__stg_product_pairings__pairing_id') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: anchor_product_id
        description: "{{ doc('shared__stg_product_pairings__anchor_product_id') }}"
        data_type: varchar
      - name: paired_product_id
        description: "{{ doc('shared__stg_product_pairings__paired_product_id') }}"
        data_type: varchar
      - name: pairing_reason
        description: "{{ doc('shared__stg_product_pairings__pairing_reason') }}"
        data_type: varchar
      - name: effective_from_utc
        description: "{{ doc('shared__stg_product_pairings__effective_from_utc') }}"
        data_type: timestamp
      - name: effective_to_utc
        description: "{{ doc('shared__stg_product_pairings__effective_to_utc') }}"
        data_type: timestamp
      - name: pairing_rank
        description: "{{ doc('shared__stg_product_pairings__pairing_rank') }}"
        data_type: integer
