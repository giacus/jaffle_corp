      - name: is_curated_pair
        description: "{{ doc('merchandising__int_basket_pair_observations__is_curated_pair') }}"
        data_type: boolean
      - name: paired_order_count
        description: "{{ doc('merchandising__fct_basket_pair_affinity__paired_order_count') }}"
