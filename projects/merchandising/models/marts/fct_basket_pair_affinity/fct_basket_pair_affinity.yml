      - name: ordered_date_utc
        description: "{{ doc('shared__stg_orders__ordered_date_utc') }}"
        data_type: date
      - name: pairing_id
        description: "{{ doc('merchandising__int_basket_pair_observations__pairing_id') }}"
        data_type: varchar
      - name: pairing_reason
        description: "{{ doc('merchandising__int_basket_pair_observations__pairing_reason') }}"
        data_type: varchar
      - name: pairing_rank
        description: "{{ doc('shared__stg_product_pairings__pairing_rank') }}"
