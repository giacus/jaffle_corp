    config:
      group: merchandising
      access: public
      contract:
        enforced: true
    columns:
      - name: basket_pair_affinity_key
        description: "{{ doc('merchandising__fct_basket_pair_affinity__basket_pair_affinity_key') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: anchor_product_id
        description: "{{ doc('merchandising__int_basket_pair_observations__anchor_product_id') }}"
        data_type: varchar
      - name: paired_product_id
        description: "{{ doc('merchandising__int_basket_pair_observations__paired_product_id') }}"
