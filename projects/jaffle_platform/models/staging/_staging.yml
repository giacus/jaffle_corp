version: 2

models:
  - name: stg_customers
    config:
      group: platform
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
      - name: email_domain
        data_tests:
          - not_null

  - name: stg_stores
    config:
      group: platform
    columns:
      - name: store_id
        data_tests: [not_null, unique]
      - name: operating_currency
        data_tests:
          - accepted_values:
              arguments:
                values: ["GBP", "CAD", "SGD", "EUR", "USD"]

  - name: stg_products
    config:
      group: merchandising
    columns:
      - name: product_id
        data_tests: [not_null, unique]
      - name: sku
        data_tests: [not_null, unique]

  - name: stg_orders
    config:
      group: platform
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["placed", "completed", "cancelled", "refunded", "unknown"]

  - name: stg_order_items
    config:
      group: platform
    columns:
      - name: order_item_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

  - name: stg_payments
    config:
      group: platform
    columns:
      - name: payment_id
        data_tests: [not_null, unique]
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["captured", "authorized", "failed", "refunded", "unknown"]

  - name: stg_refunds
    config:
      group: platform
    columns:
      - name: refund_id
        data_tests: [not_null, unique]
