version: 2

models:
  - name: stg_order_items
    config:
      group: platform
    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
    description: "{{ doc('jaffle_platform__stg_order_items') }}"
