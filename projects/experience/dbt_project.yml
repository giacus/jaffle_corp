name: jaffle_experience
version: "0.1.0"
config-version: 2

profile: jaffle_corp
require-dbt-version: "=1.11.12"
restrict-access: true

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - dbt_packages

vars:
  data_interval_start: "2026-01-01 00:00:00"
  data_interval_end: "2026-01-08 00:00:00"
  ticket_first_response_target_minutes: 10
  ticket_resolution_target_minutes: 120

models:
  jaffle_experience:
    +materialized: view
    +post-hook: "{{ jaffle_shared.audit_noop() }}"
    +meta:
      domain: experience
      source_system: synthetic_jaffle_corp
    intermediate:
      +schema: int_experience
      +materialized: ephemeral
      +tags: ["intermediate", "experience"]
      +access: protected
    marts:
      +schema: mart_experience
      +materialized: table
      +tags: ["mart", "experience"]
