version: 2

models:
  - name: dim_components
    description: Public component dimension used for recipe and stock examples.
    config:
      group: supply
      access: public
      contract:
        enforced: true
    columns:
      - name: component_id
        data_type: varchar
        data_tests: [not_null, unique]
      - name: component_name
        data_type: varchar
      - name: component_family
        data_type: varchar
      - name: recipe_unit
        data_type: varchar
      - name: product_count
        data_type: integer
      - name: minimum_recipe_waste_factor
        data_type: double
      - name: maximum_recipe_waste_factor
        data_type: double
      - name: supplier_count
        data_type: integer
      - name: primary_supplier_name
        data_type: varchar
      - name: updated_at_utc
        data_type: timestamp

  - name: fct_purchase_orders
    description: Public purchase-order fact with receipt quality and FX-normalized cost.
    config:
      group: supply
      access: public
      contract:
        enforced: true
    columns:
      - name: purchase_order_key
        data_type: varchar
        data_tests: [not_null, unique]
      - name: purchase_order_id
        data_type: varchar
      - name: store_id
        data_type: varchar
      - name: country_code
        data_type: varchar
      - name: city
        data_type: varchar
      - name: component_id
        data_type: varchar
      - name: supplier_name
        data_type: varchar
      - name: ordered_at_utc
        data_type: timestamp
      - name: expected_at_utc
        data_type: timestamp
      - name: received_at_utc
        data_type: timestamp
      - name: received_date_utc
        data_type: date
      - name: purchase_order_status
        data_type: varchar
      - name: quantity_ordered
        data_type: double
      - name: quantity_received
        data_type: double
      - name: unit
        data_type: varchar
      - name: unit_cost_major
        data_type: double
      - name: currency
        data_type: varchar
      - name: unit_cost_usd
        data_type: double
      - name: receipt_fill_rate
        data_type: double
      - name: receipt_delay_minutes
        data_type: bigint
      - name: receipt_delay_bucket
        data_type: varchar
      - name: is_late_receipt
        data_type: boolean
      - name: updated_at_utc
        data_type: timestamp

  - name: fct_product_component_costs
    description: Public product-component cost bridge at recipe-component grain.
    config:
      group: supply
      access: public
      contract:
        enforced: true
    columns:
      - name: product_component_cost_key
        data_type: varchar
        data_tests: [not_null, unique]
      - name: product_id
        data_type: varchar
      - name: component_id
        data_type: varchar
      - name: component_name
        data_type: varchar
      - name: component_family
        data_type: varchar
      - name: unit
        data_type: varchar
      - name: quantity_per_item
        data_type: double
      - name: waste_factor
        data_type: double
      - name: average_unit_cost_usd
        data_type: double
      - name: lowest_unit_cost_usd
        data_type: double
      - name: highest_unit_cost_usd
        data_type: double
      - name: expected_component_cost_usd
        data_type: double
      - name: updated_at_utc
        data_type: timestamp

  - name: fct_inventory_daily
    description: Public component inventory fact at store-component-day grain.
    config:
      group: supply
      access: public
      contract:
        enforced: true
    columns:
      - name: inventory_daily_key
        data_type: varchar
        data_tests: [not_null, unique]
      - name: store_id
        data_type: varchar
      - name: component_id
        data_type: varchar
      - name: balance_date_utc
        data_type: date
      - name: unit
        data_type: varchar
      - name: counted_quantity
        data_type: double
      - name: received_quantity
        data_type: double
      - name: expected_used_quantity
        data_type: double
      - name: expected_recipe_waste_quantity
        data_type: double
      - name: observed_waste_quantity
        data_type: double
      - name: waste_event_count
        data_type: integer
      - name: received_cost_usd
        data_type: double
      - name: estimated_closing_quantity
        data_type: double
      - name: has_count_review
        data_type: boolean
      - name: has_late_receipt
        data_type: boolean

  - name: fct_supply_risk_daily
    description: Public risk classification at store-component-day grain.
    config:
      group: supply
      access: public
      contract:
        enforced: true
    columns:
      - name: supply_risk_daily_key
        data_type: varchar
        data_tests: [not_null, unique]
      - name: store_id
        data_type: varchar
      - name: component_id
        data_type: varchar
      - name: balance_date_utc
        data_type: date
      - name: unit
        data_type: varchar
      - name: counted_quantity
        data_type: double
      - name: estimated_closing_quantity
        data_type: double
      - name: expected_used_quantity
        data_type: double
      - name: observed_waste_quantity
        data_type: double
      - name: has_count_review
        data_type: boolean
      - name: has_late_receipt
        data_type: boolean
      - name: supply_risk_status
        data_type: varchar
      - name: has_supply_risk
        data_type: boolean

