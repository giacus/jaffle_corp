version: 2

models:
  - name: dim_components
    description: "{{ doc('jaffle_supply__dim_components') }}"
    config:
      group: supply
      access: public
      contract:
        enforced: true
    columns:
      - name: component_id
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: component_name
        data_type: varchar
      - name: component_family
        data_type: varchar
      - name: recipe_unit
        data_type: varchar
      - name: product_count
        data_type: integer
      - name: minimum_recipe_waste_factor
        data_type: double
      - name: maximum_recipe_waste_factor
        data_type: double
      - name: supplier_count
        data_type: integer
      - name: primary_supplier_name
        data_type: varchar
      - name: updated_at_utc
        data_type: timestamp
