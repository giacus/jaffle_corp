version: 2

models:
  - name: fct_campaign_incrementality
    description: "{{ doc('jaffle_growth__fct_campaign_incrementality') }}"
    config:
      group: growth
      access: public
      contract:
        enforced: true
    columns:
      - name: campaign_incrementality_key
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: campaign_id
        data_type: varchar
      - name: event_date_utc
        data_type: date
      - name: channel
        data_type: varchar
      - name: touchpoint_count
        data_type: integer
      - name: click_count
        data_type: integer
      - name: redemption_count
        data_type: integer
      - name: attributed_order_count
        data_type: integer
      - name: estimated_campaign_cost_usd
        data_type: double
      - name: attributed_net_revenue_usd
        data_type: double
      - name: attributed_margin_usd
        data_type: double
      - name: nearby_exposure_count
        data_type: hugeint
      - name: nearby_conversion_count
        data_type: hugeint
      - name: nearby_experiment_net_revenue_usd_7d
        data_type: double
      - name: heuristic_incremental_revenue_usd
        data_type: double
      - name: heuristic_incremental_margin_usd
        data_type: double
      - name: heuristic_incremental_roas
        data_type: double
