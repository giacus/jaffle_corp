version: 2

models:
  - name: fct_purchase_orders
    description: "{{ doc('jaffle_supply__fct_purchase_orders') }}"
    config:
      group: supply
      access: public
      contract:
        enforced: true
    columns:
      - name: purchase_order_key
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: purchase_order_id
        data_type: varchar
      - name: store_id
        data_type: varchar
      - name: country_code
        data_type: varchar
      - name: city
        data_type: varchar
      - name: component_id
        data_type: varchar
      - name: supplier_name
        data_type: varchar
      - name: ordered_at_utc
        data_type: timestamp
      - name: expected_at_utc
        data_type: timestamp
      - name: received_at_utc
        data_type: timestamp
      - name: received_date_utc
        data_type: date
      - name: purchase_order_status
        data_type: varchar
      - name: quantity_ordered
        data_type: double
      - name: quantity_received
        data_type: double
      - name: unit
        data_type: varchar
      - name: unit_cost_major
        data_type: double
      - name: currency
        data_type: varchar
      - name: unit_cost_usd
        data_type: double
      - name: receipt_fill_rate
        data_type: double
      - name: receipt_delay_minutes
        data_type: bigint
      - name: receipt_delay_bucket
        data_type: varchar
      - name: is_late_receipt
        data_type: boolean
      - name: updated_at_utc
        data_type: timestamp
