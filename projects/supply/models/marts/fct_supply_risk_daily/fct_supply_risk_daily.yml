      group: supply
      access: public
      contract:
        enforced: true
    columns:
      - name: supply_risk_daily_key
        description: "{{ doc('supply__fct_supply_risk_daily__supply_risk_daily_key') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: store_id
        description: "{{ doc('supply__int_inventory_daily_balance__store_id') }}"
        data_type: varchar
      - name: component_id
        description: "{{ doc('supply__int_inventory_daily_balance__component_id') }}"
        data_type: varchar
      - name: balance_date_utc
        description: "{{ doc('supply__int_inventory_daily_balance__balance_date_utc') }}"
