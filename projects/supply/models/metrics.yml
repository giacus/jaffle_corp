version: 2

metrics:
  - name: supply_risk_days
    description: Count of store-component days with a supply risk flag.
    type: simple
    label: Supply Risk Days
    type_params:
      measure: risky_supply_day_count

  - name: supply_risk_day_count
    description: Count of store-component-day records.
    type: simple
    label: Supply Risk Day Count
    type_params:
      measure: supply_risk_day_count

  - name: supply_risk_rate
    description: Share of component days with a risk flag.
    type: ratio
    label: Supply Risk Rate
    type_params:
      numerator: supply_risk_days
      denominator: supply_risk_day_count

  - name: purchase_order_count
    description: Count of purchase orders.
    type: simple
    label: Purchase Order Count
    type_params:
      measure: purchase_order_count

  - name: late_purchase_order_count
    description: Count of late purchase orders.
    type: simple
    label: Late Purchase Order Count
    type_params:
      measure: late_purchase_order_count

  - name: late_purchase_order_rate
    description: Share of purchase orders received after the expected timestamp.
    type: ratio
    label: Late Purchase Order Rate
    type_params:
      numerator: late_purchase_order_count
      denominator: purchase_order_count

