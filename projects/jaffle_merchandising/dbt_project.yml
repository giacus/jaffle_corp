name: jaffle_merchandising
version: "0.1.0"
config-version: 2

profile: jaffle_corp
require-dbt-version: ">=1.8.0,<2.0.0"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: target
clean-targets:
  - target
  - dbt_packages

vars:
  data_interval_start: "2026-01-01 00:00:00"
  data_interval_end: "2026-01-08 00:00:00"
  window_hours_back: 24

models:
  jaffle_merchandising:
    +materialized: view
    +post-hook: "{{ jaffle_shared.audit_noop() }}"
    +meta:
      domain: merchandising
      source_system: synthetic_jaffle_corp
    staging:
      +schema: stg_merchandising
      +materialized: view
      +tags: ["staging", "merchandising"]
      +access: protected
    intermediate:
      +schema: int_merchandising
      +materialized: ephemeral
      +tags: ["intermediate", "merchandising"]
      +access: protected
    marts:
      +schema: mart_merchandising
      +materialized: table
      +tags: ["mart", "merchandising"]
seeds:
  jaffle_merchandising:
    +schema: raw
    +quote_columns: false
