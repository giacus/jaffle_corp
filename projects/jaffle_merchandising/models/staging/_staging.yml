version: 2

models:
  - name: stg_menu_publications
    config:
      group: merchandising
    columns:
      - name: publication_id
        data_tests: [not_null, unique]
      - name: published_price_minor
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: stg_product_availability
    config:
      group: merchandising
    columns:
      - name: availability_id
        data_tests: [not_null, unique]
      - name: availability_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["available", "limited", "unavailable", "unknown"]

  - name: stg_price_adjustments
    config:
      group: merchandising
    columns:
      - name: price_adjustment_id
        data_tests: [not_null, unique]

  - name: stg_menu_goals
    config:
      group: merchandising
    columns:
      - name: goal_id
        data_tests: [not_null, unique]

  - name: stg_product_pairings
    config:
      group: merchandising
    columns:
      - name: pairing_id
        data_tests: [not_null, unique]

  - name: stg_substitution_rules
    config:
      group: merchandising
    columns:
      - name: substitution_rule_id
        data_tests: [not_null, unique]
