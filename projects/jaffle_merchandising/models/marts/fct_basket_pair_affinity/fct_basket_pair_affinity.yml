    config:
      group: merchandising
      access: public
      contract:
        enforced: true
    columns:
      - name: basket_pair_affinity_key
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: anchor_product_id
        data_type: varchar
      - name: paired_product_id
        data_type: varchar
      - name: ordered_date_utc
        data_type: date
      - name: pairing_id
        data_type: varchar
      - name: pairing_reason
        data_type: varchar
      - name: pairing_rank
        data_type: integer
      - name: is_curated_pair
