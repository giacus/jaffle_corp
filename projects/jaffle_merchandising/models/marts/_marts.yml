version: 2

models:
  - name: dim_menu_items
    description: Menu publication dimension at one row per store-product publication window.
    config:
      group: merchandising
    columns:
      - name: menu_product_window_key
        data_tests: [not_null, unique]

  - name: dim_product_pairings
    description: Curated product pairings used for basket analysis.
    config:
      group: merchandising
    columns:
      - name: pairing_id
        data_tests: [not_null, unique]

  - name: fct_product_store_hour_availability
    description: Availability fact at product-store-hour grain.
    config:
      group: merchandising
    columns:
      - name: product_store_hour_key
        data_tests: [not_null, unique]

  - name: fct_product_store_day_availability
    description: Availability fact at product-store-day grain.
    config:
      group: merchandising
    columns:
      - name: product_store_day_availability_key
        data_tests: [not_null, unique]

  - name: fct_price_adjustment_windows
    description: Temporary price adjustment windows and their deltas from menu price.
    config:
      group: merchandising
    columns:
      - name: price_adjustment_window_key
        data_tests: [not_null, unique]

  - name: fct_menu_margin_baseline
    description: Recipe-cost margin baseline at store-product publication-window grain.
    config:
      group: merchandising
      meta:
        exercise_hint: "This model intentionally keeps local currency naming loose; students can make the currency handling more explicit."
    columns:
      - name: menu_item_margin_baseline_key
        data_tests: [not_null, unique]

  - name: fct_menu_goal_progress
    description: Weekly menu target attainment by store and product family.
    config:
      group: merchandising
    columns:
      - name: menu_goal_progress_key
        data_tests: [not_null, unique]

  - name: fct_basket_pair_affinity
    description: Product-pair affinity fact at product-pair-day grain.
    config:
      group: merchandising
    columns:
      - name: basket_pair_affinity_key
        data_tests: [not_null, unique]

  - name: fct_substitution_readiness
    description: Substitution-rule readiness fact at rule-day grain.
    config:
      group: merchandising
    columns:
      - name: substitution_coverage_key
        data_tests: [not_null, unique]
