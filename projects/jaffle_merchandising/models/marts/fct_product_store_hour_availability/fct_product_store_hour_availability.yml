version: 2

models:
  - name: fct_product_store_hour_availability
    description: "{{ doc('jaffle_merchandising__fct_product_store_hour_availability') }}"
    config:
      group: merchandising
      access: public
      contract:
        enforced: true
    columns:
      - name: product_store_hour_key
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: availability_id
        data_type: varchar
      - name: store_id
        data_type: varchar
      - name: product_id
        data_type: varchar
      - name: available_date_utc
        data_type: date
      - name: availability_hour_utc
        data_type: timestamp
      - name: hour_local
        data_type: integer
      - name: availability_status
        data_type: varchar
      - name: observed_on_hand_units
        data_type: integer
      - name: expected_menu_units
        data_type: integer
      - name: outage_minutes
        data_type: integer
      - name: availability_health
        data_type: varchar
      - name: available_hour_count
        data_type: integer
      - name: constrained_hour_count
        data_type: integer
      - name: unavailable_hour_count
        data_type: integer
      - name: publication_id
        data_type: varchar
      - name: menu_section
        data_type: varchar
      - name: menu_surface
        data_type: varchar
      - name: menu_price_band
        data_type: varchar
      - name: product_family
        data_type: varchar
      - name: country_code
        data_type: varchar
      - name: city
        data_type: varchar
      - name: updated_at_utc
        data_type: timestamp
