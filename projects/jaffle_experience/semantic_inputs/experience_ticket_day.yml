name: experience_ticket_day
grain: support_ticket_day
owner: experience
description: Lightweight example spec for a day-grain support mart.
inputs:
  - ref: fct_support_tickets
    time_column: opened_date_utc
  - ref: fct_customer_contact_threads
    join_key: support_ticket_id
dimensions:
  - normalized_issue_type
  - first_response_sla_status
  - resolution_sla_status
measures:
  - support_ticket_count
  - concession_major
  - contact_event_count

