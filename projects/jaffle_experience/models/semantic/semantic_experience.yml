version: 2

semantic_models:
  - name: support_tickets
    description: Support semantic model for ticket volume and SLA metrics.
    model: ref('fct_support_tickets')
    defaults:
      agg_time_dimension: opened_date
    entities:
      - name: support_ticket
        type: primary
        expr: support_ticket_id
      - name: customer
        type: foreign
        expr: customer_id
      - name: order
        type: foreign
        expr: order_id
      - name: location
        type: foreign
        expr: store_id
    dimensions:
      - name: opened_date
        type: time
        expr: opened_date_utc
        type_params:
          time_granularity: day
      - name: normalized_issue_type
        type: categorical
      - name: first_response_sla_status
        type: categorical
      - name: resolution_sla_status
        type: categorical
    measures:
      - name: support_ticket_count
        expr: 1
        agg: sum
      - name: first_response_sla_met_count
        expr: case when met_first_response_sla then 1 else 0 end
        agg: sum
      - name: resolution_sla_met_count
        expr: case when met_resolution_sla then 1 else 0 end
        agg: sum
      - name: concession_amount
        expr: concession_major
        agg: sum

  - name: experiment_outcomes
    description: Experiment semantic model for exposure and conversion metrics.
    model: ref('fct_experiment_outcomes')
    defaults:
      agg_time_dimension: exposed_date
    entities:
      - name: experiment_outcome
        type: primary
        expr: exposure_id
      - name: customer
        type: foreign
        expr: customer_id
    dimensions:
      - name: exposed_date
        type: time
        expr: exposed_date_utc
        type_params:
          time_granularity: day
      - name: experiment_id
        type: categorical
      - name: variant_id
        type: categorical
      - name: surface
        type: categorical
    measures:
      - name: experiment_exposure_count
        expr: 1
        agg: sum
      - name: experiment_conversion_count
        expr: case when converted_7d then 1 else 0 end
        agg: sum
      - name: experiment_net_revenue_usd_7d
        expr: net_revenue_usd_7d
        agg: sum

metrics:
  - name: support_ticket_count
    description: Count of support tickets.
    type: simple
    label: Support Ticket Count
    type_params:
      measure: support_ticket_count

  - name: first_response_sla_met_count
    description: Count of tickets with first response inside target.
    type: simple
    label: First Response SLA Met Count
    type_params:
      measure: first_response_sla_met_count

  - name: first_response_sla_rate
    description: Share of tickets with first response inside target.
    type: ratio
    label: First Response SLA Rate
    type_params:
      numerator: first_response_sla_met_count
      denominator: support_ticket_count

  - name: experiment_exposure_count
    description: Count of experiment exposures.
    type: simple
    label: Experiment Exposure Count
    type_params:
      measure: experiment_exposure_count

  - name: experiment_conversion_count
    description: Count of exposures that completed an order within seven days.
    type: simple
    label: Experiment Conversion Count
    type_params:
      measure: experiment_conversion_count

  - name: experiment_conversion_rate
    description: Share of exposures with a completed order within seven days.
    type: ratio
    label: Experiment Conversion Rate
    type_params:
      numerator: experiment_conversion_count
      denominator: experiment_exposure_count

