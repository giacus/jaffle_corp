      - name: incident_duration_bucket
        description: "{{ doc('store_ops__fct_incident_reviews__incident_duration_bucket') }}"
        data_type: varchar
      - name: is_high_attention
        description: "{{ doc('store_ops__fct_incident_reviews__is_high_attention') }}"
        data_type: boolean
      - name: updated_at_utc
        description: "{{ doc('shared__stg_service_incidents__updated_at_utc') }}"
        data_type: timestamp
