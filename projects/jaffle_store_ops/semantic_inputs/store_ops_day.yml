name: store_ops_day
grain: store_day
owner: store_ops
description: Lightweight example spec for a store-day operations mart.
inputs:
  - ref: fct_store_day_operations
    time_column: operating_date
  - ref: fct_order_service_times
    time_column: ordered_date_utc
dimensions:
  - store_id
  - store_day_status
  - country_code
measures:
  - order_count
  - ready_inside_target_count
  - quality_exception_count
  - incident_count

