version: 2

models:
  - name: stg_service_incidents
    config:
      group: store_ops
    columns:
      - name: incident_id
        data_tests:
          - not_null
          - unique
      - name: severity
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - low
                  - medium
                  - high
    description: "{{ doc('jaffle_store_ops__stg_service_incidents') }}"
