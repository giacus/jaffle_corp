version: 2

models:
  - name: stg_quality_checks
    config:
      group: store_ops
    columns:
      - name: quality_check_id
        data_tests:
          - not_null
          - unique
      - name: check_result
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - pass
                  - review
                  - fail
    description: "{{ doc('jaffle_store_ops__stg_quality_checks') }}"
