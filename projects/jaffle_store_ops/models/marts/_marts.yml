version: 2

models:
  - name: fct_order_service_times
    description: Public order-level kitchen timing fact.
    config:
      group: store_ops
      access: public
      contract:
        enforced: true
    columns:
      - name: order_service_time_key
        data_type: varchar
        data_tests: [not_null, unique]
      - name: order_id
        data_type: varchar
      - name: store_id
        data_type: varchar
      - name: customer_id
        data_type: varchar
      - name: ordered_at_utc
        data_type: timestamp
      - name: ordered_date_utc
        data_type: date
      - name: order_status
        data_type: varchar
      - name: is_completed_order
        data_type: boolean
      - name: kitchen_received_at_utc
        data_type: timestamp
      - name: prep_started_at_utc
        data_type: timestamp
      - name: ready_at_utc
        data_type: timestamp
      - name: served_at_utc
        data_type: timestamp
      - name: event_date_utc
        data_type: date
      - name: stations_seen
        data_type: varchar
      - name: kitchen_event_count
        data_type: integer
      - name: received_to_ready_minutes
        data_type: bigint
      - name: prep_to_ready_minutes
        data_type: bigint
      - name: ready_to_served_minutes
        data_type: bigint
      - name: received_to_ready_bucket
        data_type: varchar
      - name: met_ready_target
        data_type: boolean

  - name: fct_store_day_operations
    description: Public store-day operating fact combining finance, timing, quality, supply, and incidents.
    config:
      group: store_ops
      access: public
      contract:
        enforced: true
    columns:
      - name: store_day_operations_key
        data_type: varchar
        data_tests: [not_null, unique]
      - name: store_id
        data_type: varchar
      - name: operating_date
        data_type: date
      - name: country_code
        data_type: varchar
      - name: city
        data_type: varchar
      - name: franchise_owner
        data_type: varchar
      - name: order_count
        data_type: integer
      - name: net_revenue_usd
        data_type: double
      - name: estimated_gross_margin_usd
        data_type: double
      - name: order_timing_count
        data_type: integer
      - name: average_received_to_ready_minutes
        data_type: double
      - name: ready_inside_target_count
        data_type: integer
      - name: ready_target_rate
        data_type: double
      - name: planned_minutes
        data_type: hugeint
      - name: actual_minutes
        data_type: hugeint
      - name: peak_team_member_count
        data_type: integer
      - name: orders_per_actual_minute
        data_type: double
      - name: shift_exception_count
        data_type: hugeint
      - name: quality_check_count
        data_type: hugeint
      - name: quality_exception_count
        data_type: hugeint
      - name: quality_exception_rate
        data_type: double
      - name: component_day_count
        data_type: integer
      - name: supply_risk_component_count
        data_type: integer
      - name: supply_risk_component_rate
        data_type: double
      - name: incident_count
        data_type: integer
      - name: affected_order_count
        data_type: hugeint
      - name: incident_minutes
        data_type: hugeint
      - name: store_day_status
        data_type: varchar

  - name: fct_quality_events
    description: Public quality-check event fact.
    config:
      group: store_ops
      access: public
      contract:
        enforced: true
    columns:
      - name: quality_event_key
        data_type: varchar
        data_tests: [not_null, unique]
      - name: quality_check_id
        data_type: varchar
      - name: store_id
        data_type: varchar
      - name: order_id
        data_type: varchar
      - name: product_id
        data_type: varchar
      - name: check_type
        data_type: varchar
      - name: check_result
        data_type: varchar
      - name: measured_value
        data_type: double
      - name: expected_min
        data_type: double
      - name: expected_max
        data_type: double
      - name: checked_at_utc
        data_type: timestamp
      - name: checked_date_utc
        data_type: date
      - name: has_quality_exception
        data_type: boolean
      - name: updated_at_utc
        data_type: timestamp

  - name: fct_incident_reviews
    description: Public store incident review fact.
    config:
      group: store_ops
      access: public
      contract:
        enforced: true
    columns:
      - name: incident_review_key
        data_type: varchar
        data_tests: [not_null, unique]
      - name: incident_id
        data_type: varchar
      - name: store_id
        data_type: varchar
      - name: opened_at_utc
        data_type: timestamp
      - name: resolved_at_utc
        data_type: timestamp
      - name: opened_date_utc
        data_type: date
      - name: incident_type
        data_type: varchar
      - name: severity
        data_type: varchar
      - name: affected_orders
        data_type: integer
      - name: notes_code
        data_type: varchar
      - name: incident_minutes
        data_type: bigint
      - name: incident_duration_bucket
        data_type: varchar
      - name: is_high_attention
        data_type: boolean
      - name: updated_at_utc
        data_type: timestamp

  - name: dim_store_operating_profiles
    description: Public store operating profile dimension.
    config:
      group: store_ops
      access: public
      contract:
        enforced: true
    columns:
      - name: store_id
        data_type: varchar
        data_tests: [not_null, unique]
      - name: store_name
        data_type: varchar
      - name: country_code
        data_type: varchar
      - name: city
        data_type: varchar
      - name: timezone_name
        data_type: varchar
      - name: operating_currency
        data_type: varchar
      - name: franchise_owner
        data_type: varchar
      - name: is_dark_kitchen
        data_type: boolean
      - name: daypart_count
        data_type: bigint
      - name: average_shift_adherence_ratio
        data_type: double
      - name: peak_team_member_count
        data_type: integer
      - name: observed_role_mix_codes
        data_type: varchar

