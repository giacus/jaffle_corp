version: 2

models:
  - name: fct_incident_reviews
    description: "{{ doc('jaffle_store_ops__fct_incident_reviews') }}"
    config:
      group: store_ops
      access: public
      contract:
        enforced: true
    columns:
      - name: incident_review_key
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: incident_id
        data_type: varchar
      - name: store_id
        data_type: varchar
      - name: opened_at_utc
        data_type: timestamp
      - name: resolved_at_utc
        data_type: timestamp
      - name: opened_date_utc
        data_type: date
      - name: incident_type
        data_type: varchar
      - name: severity
        data_type: varchar
      - name: affected_orders
        data_type: integer
      - name: notes_code
        data_type: varchar
      - name: incident_minutes
        data_type: bigint
      - name: incident_duration_bucket
        data_type: varchar
      - name: is_high_attention
        data_type: boolean
      - name: updated_at_utc
        data_type: timestamp
