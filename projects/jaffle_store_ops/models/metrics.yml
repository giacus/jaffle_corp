version: 2

metrics:
  - name: store_ops_order_count
    description: Store operations order count.
    type: simple
    label: Store Ops Order Count
    type_params:
      measure: store_ops_order_count

  - name: store_ops_ready_inside_target_count
    description: Orders ready inside target.
    type: simple
    label: Store Ops Ready Inside Target Count
    type_params:
      measure: store_ops_ready_inside_target_count

  - name: store_ops_order_timing_count
    description: Orders with service-time records.
    type: simple
    label: Store Ops Order Timing Count
    type_params:
      measure: store_ops_order_timing_count

  - name: kitchen_ready_target_rate
    description: Share of timed orders ready inside target.
    type: ratio
    label: Kitchen Ready Target Rate
    type_params:
      numerator: store_ops_ready_inside_target_count
      denominator: store_ops_order_timing_count

  - name: store_ops_quality_exception_count
    description: Count of quality exceptions in store operations.
    type: simple
    label: Store Ops Quality Exception Count
    type_params:
      measure: store_ops_quality_exception_count

  - name: store_ops_incident_count
    description: Count of store incidents.
    type: simple
    label: Store Ops Incident Count
    type_params:
      measure: store_ops_incident_count

