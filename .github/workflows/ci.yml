name: ci

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install local toolchain
        run: |
          python -m venv .venv
          bash scripts/install_venv_hook.sh
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          dbt --version

      - name: Smoke test README onboarding
        run: |
          source .venv/bin/activate
          dbt debug --project-dir projects/jaffle_platform
          dbt deps --project-dir projects/jaffle_platform
          cd projects/jaffle_shared
          dbt compile

      - name: Validate repo
        run: |
          source .venv/bin/activate
          scripts/validate_repo.sh
