name: Manual Actions policy check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Manual-only workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Reject automatic GitHub Actions triggers
        run: python scripts/check_actions_policy.py
