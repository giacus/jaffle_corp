name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install dbt packages
        run: |
          dbt deps --project-dir projects/jaffle_platform --profiles-dir .
          dbt deps --project-dir projects/jaffle_supply --profiles-dir .
          dbt deps --project-dir projects/jaffle_finance --profiles-dir .
          dbt deps --project-dir projects/jaffle_experience --profiles-dir .
          dbt deps --project-dir projects/jaffle_growth --profiles-dir .
          dbt deps --project-dir projects/jaffle_store_ops --profiles-dir .
          dbt deps --project-dir projects/jaffle_merchandising --profiles-dir .
          dbt deps --project-dir projects/jaffle_planning --profiles-dir .
          dbt deps --project-dir projects/jaffle_legacy --profiles-dir .
      - name: Parse projects
        run: |
          dbt parse --project-dir projects/jaffle_platform --profiles-dir .
          dbt parse --project-dir projects/jaffle_supply --profiles-dir .
          dbt parse --project-dir projects/jaffle_finance --profiles-dir .
          dbt parse --project-dir projects/jaffle_experience --profiles-dir .
          dbt parse --project-dir projects/jaffle_growth --profiles-dir .
          dbt parse --project-dir projects/jaffle_store_ops --profiles-dir .
          dbt parse --project-dir projects/jaffle_merchandising --profiles-dir .
          dbt parse --project-dir projects/jaffle_planning --profiles-dir .
          dbt parse --project-dir projects/jaffle_legacy --profiles-dir .
